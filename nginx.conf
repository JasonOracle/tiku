# [变更日志]
# 修改时间：2026-09-13
# AI模型：Deepseek-V4.1-Flash 底层
# 修改内容：[1. 修复访问 /admin（缺少结尾斜杠）时未命中 /admin/ 前缀路由、被 C 端 SPA 兜底接管而错误渲染 C 端页面的缺陷，新增 location = /admin 精确匹配并 301 重定向至 /admin/]
#
# Nginx 反向代理配置
# 路由规则：
#   /api/v1/        → FastAPI backend:8000
#   /docs           → FastAPI Swagger 文档
#   /openapi.json   → FastAPI OpenAPI schema
#   /uploads/       → FastAPI 静态文件
#   /admin/         → tob 管理后台静态产物 (base='/admin/')
#   /               → toc C端 H5 静态产物

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # ─────────── FastAPI Swagger 文档代理 ───────────
    location /docs {
        proxy_pass         http://backend:8000/docs;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass         http://backend:8000/openapi.json;
        proxy_set_header   Host $host;
    }

    location /redoc {
        proxy_pass         http://backend:8000/redoc;
        proxy_set_header   Host $host;
    }

    # ─────────── API 后端反向代理 ───────────
    location /api/v1/ {
        proxy_pass         http://backend:8000/api/v1/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ─────────── 上传文件静态代理 ───────────
    location /uploads/ {
        proxy_pass         http://backend:8000/uploads/;
        proxy_set_header   Host $host;
    }

    # ─────────── B端管理后台 (/admin/) ───────────
    # 精确匹配不带结尾斜杠的 /admin：否则会掉进 location / 被 C 端 SPA 兜底接管
    location = /admin {
        return 301 /admin/;
    }

    # tob build base='/admin/'，所有资源路径为 /admin/assets/xxx
    # alias 将 /admin/ 映射到容器内静态目录，try_files 保证 history 路由刷新不 404
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ─────────── C端 H5 (根路径) ───────────
    location / {
        root  /usr/share/nginx/html/toc;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
