services:
  - type: web
    name: tiku-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SENSENOVA_API_KEY
        sync: false
      - key: XIAO_HONG_SHU_API_KEY
        sync: false
      - key: TIDB_VECTOR
        value: 0
